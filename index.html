<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="img/logflow_logo.png" type="image/x-icon">
    <title>LogFlow - Scanner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #f0f4f8;
            min-height: 100vh;
            padding: 20px;
            transition: all 0.3s ease;
        }

        body.dark-mode {
            background: #0a0e27;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 20px;
            background: white;
            border-radius: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            border: 1px solid #e8ecf1;
        }

        body.dark-mode .navbar {
            background: #1a202c;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            border: 1px solid #2d3748;
        }

        .navbar h1 {
            color: #001F5B;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .navbar-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #001F5B;
            color: white;
        }

        .btn-primary:hover {
            background: #003a9e;
            box-shadow: 0 4px 12px rgba(0, 31, 91, 0.15);
        }

        .btn-toggle {
            background: #f0f4f8;
            color: #1e293b;
            border: 1px solid #d1d9e0;
        }

        body.dark-mode .btn-toggle {
            background: #334155;
            color: #e2e8f0;
            border-color: #475569;
        }

        .btn-toggle:hover {
            background: #e8ecf1;
        }

        body.dark-mode .btn-toggle:hover {
            background: #475569;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            margin-bottom: 20px;
            border: 1px solid #e8ecf1;
        }

        body.dark-mode .card {
            background: #1a202c;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            border: 1px solid #2d3748;
        }

        .card h2 {
            color: #001F5B;
            margin-bottom: 20px;
            font-size: 1.3rem;
            border-bottom: 2px solid #001F5B;
            padding-bottom: 10px;
        }

        body.dark-mode .card h2 {
            color: #00d4ff;
            border-color: #00d4ff;
        }

        .buttons-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .buttons-group button {
            flex: 1;
            padding: 12px;
            border: 1px solid #d1d9e0;
            background: white;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            font-size: 14px;
        }

        body.dark-mode .buttons-group button {
            background: #334155;
            border-color: #475569;
            color: #e2e8f0;
        }

        .buttons-group button.active {
            background: #001F5B;
            color: white;
            border-color: #001F5B;
            box-shadow: 0 2px 8px rgba(0, 31, 91, 0.15);
        }

        .buttons-group button.active.saida {
            background: #dc2626;
            border-color: #dc2626;
            box-shadow: 0 2px 8px rgba(220, 38, 38, 0.15);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #1e293b;
            font-size: 14px;
            text-transform: uppercase;
        }

        body.dark-mode label {
            color: #e2e8f0;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d9e0;
            border-radius: 6px;
            font-size: 14px;
            background: white;
            color: #1e293b;
            font-family: inherit;
            transition: all 0.3s;
        }

        body.dark-mode input {
            background: #334155;
            border-color: #475569;
            color: #e2e8f0;
        }

        input:focus {
            outline: none;
            border-color: #001F5B;
            box-shadow: 0 0 0 3px rgba(0, 31, 91, 0.05);
        }

        body.dark-mode input:focus {
            border-color: #00d4ff;
            box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.1);
        }

        input::placeholder {
            color: #999;
        }

        .button-submit {
            width: 100%;
            padding: 14px;
            background: #001F5B;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .button-submit:hover {
            background: #003a9e;
            box-shadow: 0 4px 12px rgba(0, 31, 91, 0.15);
        }

        .button-submit:active {
            transform: translateY(0);
        }

        .alert {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-weight: bold;
            display: none;
        }

        .alert.success {
            background: #dcfce7;
            color: #166534;
            border: 1px solid #22c55e;
        }

        .alert.error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #ef4444;
        }

        body.dark-mode .alert.success {
            background: #064e3b;
            color: #86efac;
        }

        body.dark-mode .alert.error {
            background: #7f1d1d;
            color: #fca5a5;
        }

        .saldo-info {
            background: #f1f5f9;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            text-align: center;
            display: none;
        }

        body.dark-mode .saldo-info {
            background: #334155;
            color: #e2e8f0;
        }

        .saldo-info strong {
            color: #001F5B;
            font-size: 14px;
        }

        body.dark-mode .saldo-info strong {
            color: #00d4ff;
        }

        .saldo-info .number {
            font-size: 24px;
            font-weight: bold;
            color: #001F5B;
        }

        body.dark-mode .saldo-info .number {
            color: #00d4ff;
        }

        .button-qrcode {
            width: 100%;
            padding: 12px;
            background: #0066cc;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            margin-bottom: 15px;
            transition: all 0.3s;
        }

        .button-qrcode:hover {
            background: #0052a3;
            box-shadow: 0 2px 8px rgba(0, 102, 204, 0.15);
        }

        .loader {
            display: none;
            text-align: center;
            padding: 20px;
            color: #999;
        }

        .loader.active {
            display: block;
        }

        @media (max-width: 600px) {
            .navbar {
                flex-direction: column;
                align-items: flex-start;
            }

            .navbar-actions {
                width: 100%;
            }

            .navbar-actions .btn {
                flex: 1;
            }

            .card {
                padding: 20px;
            }
        }
        @keyframes slideDown {
        from {
            opacity: 0;
            transform: translateY(-10px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
        }

        label[type="checkbox"] {
            transition: all 0.3s ease;
        }

        label[type="checkbox"]:hover {
            background: #e8ecf1 !important;
            border-color: #001F5B !important;
        }

        #temValidade:checked {
            accent-color: #001F5B;
        }

        body.dark-mode label[type="checkbox"] {
            background: #334155 !important;
        }

        body.dark-mode label[type="checkbox"]:hover {
            background: #475569 !important;
        }
        input, textarea, select, button {
            font-size: 16px;
        }
        .produto-sugestao:hover { background: #f1f5f9; }
        #autocompleteLista { position: relative; z-index: 20; }
        @media (max-width: 480px) {
            #scanner-qr,
            #scanner-qr video { height: 180px !important; }
            #scanner-qr { max-width: 300px; }
            #autocompleteLista { max-height: 240px !important; }
            .produto-sugestao { min-height: 56px; }
        }

        #scanner-qr {
            max-width: 420px;
            height: 220px;
            margin: 10px auto 15px !important;
            border-radius: 10px;
            overflow: hidden;
            background: #111827;
        }

        #scanner-qr[hidden] {
            display: none !important;
            height: 0 !important;
            margin: 0 !important;
        }

        #scanner-qr video {
            width: 100% !important;
            height: 220px !important;
            object-fit: cover;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- NAVBAR -->
    <div class="navbar">
        <h1><img src="img/logflow_logo.png" alt="logo" style="width: 80px; height: 80px;"> LogFlow</h1>
        <div class="navbar-actions">
            <button class="btn btn-primary" onclick="window.location.href='dashboard.html'">📊 DASHBOARD</button>
            <button class="btn btn-primary" onclick="window.location.href='audit-logs.html'">📝 AUDITORIA</button>
            <button class="btn btn-toggle" onclick="alternarTema()">🌙 Tema</button>
             <button class="btn btn-primary" style="background: #dc2626;" onclick="logout()">🚪 SAIR</button>
        </div>
    </div>

    <!-- SCANNER -->
    <div class="card">
        <h2>🎯 Scanner de Estoque</h2>

        <!-- TIPO DE OPERAÇÃO -->
        <div class="form-group">
            <label>Tipo de Operação</label>
            <div class="buttons-group">
                <button class="active" id="btnEntrada" onclick="selecionarTipo('ENTRADA')">📥 ENTRADA</button>
                <button id="btnSaida" onclick="selecionarTipo('SAIDA')">📤 SAÍDA</button>
            </div>
        </div>

        <!-- Scanner QR Code -->
        <div id="scanner-qr" hidden></div>

        <button class="button-qrcode" id="btnQRCode" type="button">📷 ABRIR LEITOR</button>

        <!-- FORMULÁRIO -->
        <form id="formEstoque" onsubmit="enviarLancamento(event)">
            <!-- CÓDIGO -->
            <div class="form-group">
                <label for="codigo">Código do Produto</label>
                <input type="text" id="codigo" placeholder="Digite ou escaneie o código..." required>
                
                <!-- AUTOCOMPLETE AQUI -->
                <div id="autocompleteLista" style="display: none; background: white; border: 1px solid #ddd; border-radius: 6px; margin-top: 5px; max-height: 200px; overflow-y: auto; box-shadow: 0 4px 8px rgba(0,0,0,0.1);"></div>
                
                <div class="saldo-info" id="alertaEstoque">
                    <strong>Saldo Atual:</strong>
                    <div class="number" id="saldoAtual">0</div>
                </div>
            </div>

            <!-- QUANTIDADE -->
            <div class="form-group">
                <label for="quantidade">Quantidade</label>
                <input type="number" id="quantidade" placeholder="Quantidade a movimentar..." min="1" required>
            </div>

            <!-- REFERÊNCIA -->
            <div class="form-group">
                <label for="referencia">Referência (Opcional)</label>
                <input type="text" id="referencia" placeholder="Ex: NF 1010 ou Cliente X">
            </div>

            <div class="form-group">
                <label style="display: flex; align-items: center; gap: 12px; padding: 12px; background: #f0f4f8; border-radius: 8px; cursor: pointer; border: 2px solid transparent; transition: all 0.3s;">
                    <input type="checkbox" id="temValidade" onchange="toggleValidade()" style="width: 20px; height: 20px; cursor: pointer;">
                    <span style="font-weight: 600; color: #1e293b; font-size: 14px;">⏰ Produto tem validade?</span>
                </label>
            </div>

            <div class="form-group" id="dataValidadeGroup" style="display: none; animation: slideDown 0.3s ease-in-out;">
                <label>Data de Validade</label>
                <input type="date" id="dataValidade" style="font-size: 14px;">
            </div>
            
            <!-- ALERTA -->
            <div class="alert" id="mensagemEstoque"></div>

            <!-- LOADER -->
            <div class="loader" id="loader">⏳ Processando...</div>

            <!-- BOTÃO -->
            <button type="submit" class="button-submit" id="btnSubmit">✅ FINALIZAR LANÇAMENTO</button>
        </form>
    </div>

    <!-- ATALHOS -->
    <div class="card">
        <div style="display: flex; gap: 10px; flex-wrap: wrap;">
            <button class="btn btn-primary" onclick="window.location.href='etiquetas.html'" style="flex: 1;">🎫 GERAR ETIQUETAS</button>
            <button class="btn btn-primary" onclick="window.location.href='importar_xml.html'" style="flex: 1;">📊 IMPORTAR PLANILHA</button>
            <button class="btn btn-primary" onclick="window.location.href='settings.html'" style="flex: 1;">⚙️ CONFIGURAÇÕES</button>
        </div>
    </div>
</div>
<script type="module" src="index.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
(() => {
    const botao = document.getElementById('btnQRCode');
    const area = document.getElementById('scanner-qr');
    let leitor = null;
    let ativo = false;

    function extrairCodigo(texto) {
        const bruto = String(texto || '').trim();
        if (!bruto) return '';

        try {
            const json = JSON.parse(bruto);
            if (json.codigo) return String(json.codigo).trim().toUpperCase();
            if (json.code) return String(json.code).trim().toUpperCase();
        } catch (_) {}

        return bruto.trim().toUpperCase();
    }

    async function processarCodigo(texto) {
        const codigo = extrairCodigo(texto);
        if (!codigo) return;

        const campo = document.getElementById('codigo');
        if (campo) {
            campo.value = codigo;
            campo.dispatchEvent(new Event('input', { bubbles: true }));
            campo.dispatchEvent(new Event('change', { bubbles: true }));
            campo.dispatchEvent(new Event('blur', { bubbles: true }));
        }

        await parar();
    }

    async function parar() {
        ativo = false;

        if (botao) {
            botao.textContent = '📷 ABRIR LEITOR';
            botao.setAttribute('aria-pressed', 'false');
        }

        if (area) {
            area.hidden = true;
            area.style.setProperty('display', 'none', 'important');
            area.innerHTML = '';
        }

        if (leitor) {
            const leitorAtual = leitor;
            leitor = null;
            try {
                await leitorAtual.stop();
            } catch (_) {}
            try {
                leitorAtual.clear();
            } catch (_) {}
        }
    }

    async function iniciar() {
        if (ativo) {
            await parar();
            return;
        }

        if (!navigator.mediaDevices?.getUserMedia) {
            alert('Câmera não suportada. Use Chrome ou Edge atualizado em localhost ou HTTPS.');
            return;
        }

        if (typeof Html5Qrcode === 'undefined') {
            alert('O leitor não carregou. Verifique sua conexão com a internet e recarregue a página.');
            return;
        }

        try {
            area.hidden = false;
            area.style.removeProperty('display');
            area.innerHTML = '';

            leitor = new Html5Qrcode('scanner-qr');

            await leitor.start(
                { facingMode: 'environment' },
                {
                    fps: 10,
                    qrbox: { width: 180, height: 180 },
                    aspectRatio: 1.0
                },
                (texto) => processarCodigo(texto),
                () => {}
            );

            ativo = true;
            botao.textContent = '⏹️ PARAR LEITOR';
            botao.setAttribute('aria-pressed', 'true');
        } catch (erro) {
            console.error('Erro ao iniciar leitor:', erro);
            await parar();

            const mensagem = erro?.name === 'NotAllowedError'
                ? 'Permissão da câmera negada. Autorize o acesso e tente novamente.'
                : 'Não foi possível iniciar a câmera. Use Chrome ou Edge em localhost/HTTPS.';
            alert(mensagem);
        }
    }

    botao?.addEventListener('click', iniciar);
})();
</script>
</body>
</html>
