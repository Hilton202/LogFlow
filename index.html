<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogFlow - Scanner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #f0f4f8;
            min-height: 100vh;
            padding: 20px;
            transition: all 0.3s ease;
        }

        body.dark-mode {
            background: #0a0e27;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 20px;
            background: white;
            border-radius: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            border: 1px solid #e8ecf1;
        }

        body.dark-mode .navbar {
            background: #1a202c;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            border: 1px solid #2d3748;
        }

        .navbar h1 {
            color: #001F5B;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .navbar-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #001F5B;
            color: white;
        }

        .btn-primary:hover {
            background: #003a9e;
            box-shadow: 0 4px 12px rgba(0, 31, 91, 0.15);
        }

        .btn-toggle {
            background: #f0f4f8;
            color: #1e293b;
            border: 1px solid #d1d9e0;
        }

        body.dark-mode .btn-toggle {
            background: #334155;
            color: #e2e8f0;
            border-color: #475569;
        }

        .btn-toggle:hover {
            background: #e8ecf1;
        }

        body.dark-mode .btn-toggle:hover {
            background: #475569;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            margin-bottom: 20px;
            border: 1px solid #e8ecf1;
        }

        body.dark-mode .card {
            background: #1a202c;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            border: 1px solid #2d3748;
        }

        .card h2 {
            color: #001F5B;
            margin-bottom: 20px;
            font-size: 1.3rem;
            border-bottom: 2px solid #001F5B;
            padding-bottom: 10px;
        }

        body.dark-mode .card h2 {
            color: #00d4ff;
            border-color: #00d4ff;
        }

        .buttons-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .buttons-group button {
            flex: 1;
            padding: 12px;
            border: 1px solid #d1d9e0;
            background: white;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            font-size: 14px;
        }

        body.dark-mode .buttons-group button {
            background: #334155;
            border-color: #475569;
            color: #e2e8f0;
        }

        .buttons-group button.active {
            background: #001F5B;
            color: white;
            border-color: #001F5B;
            box-shadow: 0 2px 8px rgba(0, 31, 91, 0.15);
        }

        .buttons-group button.active.saida {
            background: #dc2626;
            border-color: #dc2626;
            box-shadow: 0 2px 8px rgba(220, 38, 38, 0.15);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #1e293b;
            font-size: 14px;
            text-transform: uppercase;
        }

        body.dark-mode label {
            color: #e2e8f0;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d9e0;
            border-radius: 6px;
            font-size: 14px;
            background: white;
            color: #1e293b;
            font-family: inherit;
            transition: all 0.3s;
        }

        body.dark-mode input {
            background: #334155;
            border-color: #475569;
            color: #e2e8f0;
        }

        input:focus {
            outline: none;
            border-color: #001F5B;
            box-shadow: 0 0 0 3px rgba(0, 31, 91, 0.05);
        }

        body.dark-mode input:focus {
            border-color: #00d4ff;
            box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.1);
        }

        input::placeholder {
            color: #999;
        }

        .button-submit {
            width: 100%;
            padding: 14px;
            background: #001F5B;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .button-submit:hover {
            background: #003a9e;
            box-shadow: 0 4px 12px rgba(0, 31, 91, 0.15);
        }

        .button-submit:active {
            transform: translateY(0);
        }

        .alert {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-weight: bold;
            display: none;
        }

        .alert.success {
            background: #dcfce7;
            color: #166534;
            border: 1px solid #22c55e;
        }

        .alert.error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #ef4444;
        }

        body.dark-mode .alert.success {
            background: #064e3b;
            color: #86efac;
        }

        body.dark-mode .alert.error {
            background: #7f1d1d;
            color: #fca5a5;
        }

        .saldo-info {
            background: #f1f5f9;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            text-align: center;
            display: none;
        }

        body.dark-mode .saldo-info {
            background: #334155;
            color: #e2e8f0;
        }

        .saldo-info strong {
            color: #001F5B;
            font-size: 14px;
        }

        body.dark-mode .saldo-info strong {
            color: #00d4ff;
        }

        .saldo-info .number {
            font-size: 24px;
            font-weight: bold;
            color: #001F5B;
        }

        body.dark-mode .saldo-info .number {
            color: #00d4ff;
        }

        .button-qrcode {
            width: 100%;
            padding: 12px;
            background: #0066cc;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            margin-bottom: 15px;
            transition: all 0.3s;
        }

        .button-qrcode:hover {
            background: #0052a3;
            box-shadow: 0 2px 8px rgba(0, 102, 204, 0.15);
        }

        .loader {
            display: none;
            text-align: center;
            padding: 20px;
            color: #999;
        }

        .loader.active {
            display: block;
        }

        @media (max-width: 600px) {
            .navbar {
                flex-direction: column;
                align-items: flex-start;
            }

            .navbar-actions {
                width: 100%;
            }

            .navbar-actions .btn {
                flex: 1;
            }

            .card {
                padding: 20px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- NAVBAR -->
    <div class="navbar">
        <h1>📦 LogFlow</h1>
        <div class="navbar-actions">
            <button class="btn btn-primary" onclick="window.location.href='dashboard.html'">📊 DASHBOARD</button>
            <button class="btn btn-primary" onclick="window.location.href='audit-logs.html'">📝 AUDITORIA</button>
            <button class="btn btn-toggle" onclick="alternarTema()">🌙 Tema</button>
        </div>
    </div>

    <!-- SCANNER -->
    <div class="card">
        <h2>🎯 Scanner de Estoque</h2>

        <!-- TIPO DE OPERAÇÃO -->
        <div class="form-group">
            <label>Tipo de Operação</label>
            <div class="buttons-group">
                <button class="active" id="btnEntrada" onclick="selecionarTipo('ENTRADA')">📥 ENTRADA</button>
                <button id="btnSaida" onclick="selecionarTipo('SAIDA')">📤 SAÍDA</button>
            </div>
        </div>

        <!-- QR CODE / SCANNER -->
        <button class="button-qrcode" onclick="alert('🔄 Função de QR Code em desenvolvimento!')">📷 LER QR CODE / BIPE</button>

        <!-- FORMULÁRIO -->
        <form id="formEstoque" onsubmit="enviarLancamento(event)">
            <!-- CÓDIGO -->
            <div class="form-group">
                <label for="codigo">Código do Produto</label>
                <input type="text" id="codigo" placeholder="Digite ou escaneie o código..." required>
                <div class="saldo-info" id="alertaEstoque">
                    <strong>Saldo Atual:</strong>
                    <div class="number" id="saldoAtual">0</div>
                </div>
            </div>

            <!-- QUANTIDADE -->
            <div class="form-group">
                <label for="quantidade">Quantidade</label>
                <input type="number" id="quantidade" placeholder="Quantidade a movimentar..." min="1" required>
            </div>

            <!-- REFERÊNCIA -->
            <div class="form-group">
                <label for="referencia">Referência (Opcional)</label>
                <input type="text" id="referencia" placeholder="Ex: NF 1010 ou Cliente X">
            </div>

            <!-- ALERTA -->
            <div class="alert" id="mensagemEstoque"></div>

            <!-- LOADER -->
            <div class="loader" id="loader">⏳ Processando...</div>

            <!-- BOTÃO -->
            <button type="submit" class="button-submit" id="btnSubmit">✅ FINALIZAR LANÇAMENTO</button>
        </form>
    </div>

    <!-- ATALHOS -->
    <div class="card">
        <div style="display: flex; gap: 10px; flex-wrap: wrap;">
            <button class="btn btn-primary" onclick="window.location.href='gerar-etiquetas.html'" style="flex: 1;">🎫 GERAR ETIQUETAS</button>
            <button class="btn btn-primary" onclick="window.location.href='settings.html'" style="flex: 1;">⚙️ CONFIGURAÇÕES</button>
        </div>
    </div>
</div>

<!-- FUNÇÃO DE TEMA -->
<script>
window.alternarTema = () => {
    document.documentElement.style.colorScheme = document.body.classList.toggle('dark-mode') ? 'dark' : 'light';
    localStorage.setItem('tema', document.body.classList.contains('dark-mode') ? 'dark' : 'light');
};

if (localStorage.getItem('tema') === 'dark') {
    document.body.classList.add('dark-mode');
    document.documentElement.style.colorScheme = 'dark';
}

// TIPO DE OPERAÇÃO
let operacaoAtual = "ENTRADA";

window.selecionarTipo = (tipo) => {
    operacaoAtual = tipo;
    document.getElementById('btnEntrada').classList.remove('active');
    document.getElementById('btnSaida').classList.remove('active', 'saida');
    
    if (tipo === 'ENTRADA') {
        document.getElementById('btnEntrada').classList.add('active');
    } else {
        document.getElementById('btnSaida').classList.add('active', 'saida');
    }
};
</script>

<!-- FIREBASE E CLOUD FUNCTIONS -->
<script type="module">
import { verificarAutenticacao } from './auth.js';
verificarAutenticacao();

import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
import { getFirestore, doc, getDoc, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-auth.js";
import { httpsCallable, getFunctions } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-functions.js";

const firebaseConfig = {
    apiKey: "AIzaSyBVu2nD3RJg5q-CH-oyxJvn-6agQw09rsA",
    authDomain: "sistema-de-estoque-8ff60.firebaseapp.com",
    projectId: "sistema-de-estoque-8ff60",
    storageBucket: "sistema-de-estoque-8ff60.firebasestorage.app",
    messagingSenderId: "350798221431",
    appId: "1:350798221431:web:ee97b59412b5aa0da2b672"
};

const app = !getApps().length ? initializeApp(firebaseConfig) : getApp();
const db = getFirestore(app);
const auth = getAuth(app);
const functions = getFunctions(app);
const lancarMovimentacao = httpsCallable(functions, 'lancarMovimentacao');

let produtosDisponiveis = {};

// ===== MONITORAR PRODUTOS =====
onAuthStateChanged(auth, (user) => {
    if (!user) return;
    
    onSnapshot(collection(db, "usuarios", user.uid, "produtos"), (snapshot) => {
        produtosDisponiveis = {};
        snapshot.forEach(doc => {
            produtosDisponiveis[doc.id] = doc.data().estoque_atual || 0;
        });
        console.log("✅ Produtos carregados:", Object.keys(produtosDisponiveis).length);
    });
});

// ===== BUSCAR SALDO =====
async function buscarSaldo() {
    const user = auth.currentUser;
    if (!user) return;
    
    const codigo = document.getElementById('codigo').value.trim().toUpperCase();
    if (!codigo) {
        document.getElementById('alertaEstoque').style.display = 'none';
        return;
    }
    
    try {
        const docRef = doc(db, "usuarios", user.uid, "produtos", codigo);
        const docSnap = await getDoc(docRef);
        
        if (docSnap.exists()) {
            document.getElementById('saldoAtual').innerText = docSnap.data().estoque_atual || 0;
        } else {
            document.getElementById('saldoAtual').innerText = "0 (Novo)";
        }
        document.getElementById('alertaEstoque').style.display = 'block';
    } catch (error) {
        console.error("❌ Erro:", error);
    }
}

document.getElementById('codigo').addEventListener('change', buscarSaldo);
document.getElementById('codigo').addEventListener('blur', () => setTimeout(buscarSaldo, 100));

// ===== ENVIAR LANÇAMENTO =====
window.enviarLancamento = async (event) => {
    event.preventDefault();
    
    const user = auth.currentUser;
    if (!user) {
        alert("❌ Você não está logado!");
        return;
    }

    const codigo = document.getElementById('codigo').value.trim().toUpperCase();
    const quantidade = Number(document.getElementById('quantidade').value);
    const referencia = document.getElementById('referencia').value.trim() || "SEM REF";

    if (!codigo || !quantidade) {
        alert("⚠️ Preencha código e quantidade!");
        return;
    }

    const loader = document.getElementById('loader');
    const btnSubmit = document.getElementById('btnSubmit');
    const mensagem = document.getElementById('mensagemEstoque');

    loader.classList.add('active');
    btnSubmit.disabled = true;

    try {
        console.log(`📤 Enviando: ${operacaoAtual} de ${codigo}...`);
        
        const resultado = await lancarMovimentacao({
            codigo,
            quantidade,
            tipo: operacaoAtual,
            referencia
        });

        mensagem.className = 'alert success';
        mensagem.innerText = `✅ ${resultado.data.mensagem}`;
        mensagem.style.display = 'block';

        document.getElementById('formEstoque').reset();
        document.getElementById('alertaEstoque').style.display = 'none';
        document.getElementById('codigo').focus();
        
        setTimeout(() => {
            mensagem.style.display = 'none';
        }, 3000);

    } catch (error) {
        console.error("❌ Erro:", error);
        
        let textoErro = error.message;
        if (error.code === 'resource_exhausted') {
            textoErro = `⚠️ MUITAS TENTATIVAS!\nAguarde ${error.details.proximaTentativaEm} segundos`;
        } else if (error.code === 'failed-precondition') {
            textoErro = `❌ SALDO INSUFICIENTE!\nVocê tem: ${error.details.saldoAtual}`;
        }

        mensagem.className = 'alert error';
        mensagem.innerText = textoErro;
        mensagem.style.display = 'block';
    } finally {
        loader.classList.remove('active');
        btnSubmit.disabled = false;
    }
};

console.log("✅ Scanner carregado com sucesso!");
</script>

</body>
</html>
