<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="shortcut icon" href="img/logflow_logo.png" type="image/x-icon">
    <title>LogFlow - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #001F5B 0%, #003a9e 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
            padding: 40px;
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo img {
            height: 60px;
            margin-bottom: 10px;
        }

        .logo h1 {
            color: #001F5B;
            font-size: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input[type="email"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #001F5B;
            box-shadow: 0 0 0 3px rgba(0, 31, 91, 0.1);
        }

        button[type="submit"] {
            width: 100%;
            padding: 12px;
            background: #001F5B;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }

        button[type="submit"]:hover {
            background: #003a9e;
        }

        button[type="submit"]:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .links {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 20px;
            gap: 10px;
            font-size: 14px;
            color: #666;
        }

        .links a {
            color: #001F5B;
            text-decoration: none;
            cursor: pointer;
            border: none;
            background: none;
            padding: 0;
            font-size: 14px;
        }

        .links a:hover {
            text-decoration: underline;
        }

        /* MODAL */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            border-radius: 12px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            color: #001F5B;
            font-size: 20px;
        }

        .btn-fechar {
            background: none;
            border: none;
            font-size: 28px;
            color: #999;
            cursor: pointer;
            padding: 0;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-fechar:hover {
            color: #333;
        }

        .modal-descricao {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        #mensagemReset {
            margin-bottom: 20px;
            min-height: 60px;
            display: flex;
            align-items: center;
        }

        .btn-enviar-reset {
            width: 100%;
            padding: 12px;
            background: #16a34a;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-enviar-reset:hover {
            background: #15803d;
        }

        .btn-enviar-reset:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .mensagem-tentativas,
        .contador-suspensao {
            margin-bottom: 15px;
            padding: 12px;
            border-radius: 6px;
            text-align: center;
            font-size: 14px;
        }

        .mensagem-tentativas {
            background: #fff7ed;
            border: 1px solid #fdba74;
            color: #9a3412;
        }

        .contador-suspensao {
            background: #fee2e2;
            border: 1px solid #ef4444;
            color: #991b1b;
            font-weight: bold;
        }

        @media (max-width: 480px) {
            body { padding: 10px; }
            .login-container, .modal-content { width: calc(100% - 20px); max-width: 400px; padding: 24px 18px; }
            input, button { min-height: 44px; }
        }
    </style>
</head>
<body>

<div class="login-container">
    <div class="logo">
        <img src="img/logflow_logo.png" alt="LogFlow">
        <h1>LogFlow</h1>
    </div>

    <div id="mensagemTentativas" class="mensagem-tentativas" style="display: none;"></div>
    <div id="contadorSuspensao" class="contador-suspensao" style="display: none;"></div>

    <form id="loginForm">
        <div class="form-group">
            <label for="email">📧 Email</label>
            <input type="email" id="email" placeholder="seu@email.com" required>
        </div>

        <div class="form-group">
            <label for="senha">🔒 Senha</label>
            <input type="password" id="senha" placeholder="••••••••" required>
        </div>

        <button type="submit">Entrar</button>
    </form>

    <div class="links">
        <span>Esqueceu a senha?</span>
        <a href="#" id="btnEsqueci">Clique aqui</a>
    </div>
</div>

<!-- MODAL DE RECUPERAÇÃO DE SENHA -->
<div id="modalRecuperacao" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2>🔐 Recuperar Senha</h2>
            <button type="button" class="btn-fechar" id="btnFecharModal">×</button>
        </div>

        <p class="modal-descricao">
            Digite seu email para receber um link de recuperação de senha. Verifique sua caixa de entrada ou spam.
        </p>

        <div id="mensagemReset"></div>

        <form id="formRecuperacao">
            <div class="form-group">
                <label for="emailReset">📧 Email</label>
                <input type="email" id="emailReset" placeholder="seu@email.com" required>
            </div>

            <button type="submit" class="btn-enviar-reset">Enviar Link de Recuperação</button>
        </form>
    </div>
</div>

<script type="module" src="login.js"></script>

</body>
</html>
